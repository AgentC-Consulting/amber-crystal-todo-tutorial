name: todo_app
version: 0.1.0

description: |
  A complete, working todo app built with the Amber v2 web framework for Crystal.
  The tutorial lives in README.md — the app in this repo is the finished result.

authors:
  - The team at AgentC Consulting

crystal: ">= 1.11.0"

license: MIT

dependencies:
  # Amber v2.0.0-beta.7, pinned to the release commit.
  amber:
    github: amberframework/amber
    commit: 21deeec92b9253e9fc7252f994fc3465da0ffd4f # v2.0.0-beta.7
  granite:
    github: amberframework/granite
    version: ~> 0.23.0
  pg:
    github: will/crystal-pg
    version: ~> 0.29.0

targets:
  todo_app:
    main: src/todo_app.cr
